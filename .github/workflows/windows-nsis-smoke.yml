name: Windows NSIS smoke (unsigned)
on:
  pull_request:
    paths:
      - '.github/workflows/windows-nsis-smoke.yml'
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-nsis-smoke.mjs'
      - 'scripts/windows/test-nsis-lifecycle.ps1'
      - 'tests/nsis-smoke.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsis-smoke:
    name: Unsigned NSIS packaging + install/uninstall lifecycle smoke
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify source, contracts, release and smoke gates
        run: npm run check
      - name: Build test-only NSIS bundle without a publisher signature
        run: npm run tauri -- build --ci --bundles nsis --config src-tauri/tauri.nsis-smoke.conf.json
      - name: Verify exactly one installer and capture SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleDir = 'src-tauri/target/release/bundle/nsis'
          $files = @(Get-ChildItem -LiteralPath $bundleDir -Filter '*-setup.exe' -File -ErrorAction Stop)
          if ($files.Count -ne 1) {
            throw "Expected exactly one NSIS test installer, found $($files.Count)"
          }
          $file = $files[0]
          if ($file.Length -lt 1024) {
            throw 'NSIS installer is unexpectedly small'
          }
          New-Item -ItemType Directory -Path 'smoke-dist' -Force | Out-Null
          Copy-Item -LiteralPath $file.FullName -Destination 'smoke-dist/'
          $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
          $signature = (Get-AuthenticodeSignature -LiteralPath $file.FullName).Status
          @(
            'OPTIC NSIS TEST ARTIFACT — NOT A RELEASE'
            'UNSIGNED / LIFECYCLE TEST REQUIRED; NOT GUI/RELEASE-TESTED'
            "Source commit: ${{ github.sha }}"
            "Filename: $($file.Name)"
            "Bytes: $($file.Length)"
            "SHA256: $($hash.Hash)"
            "Authenticode status: $signature"
            'Not published to GitHub Releases'
            'No Bridge, updater endpoint, or user-PC operation performed'
          ) | Set-Content -Path 'smoke-dist/PROVENANCE.txt' -Encoding utf8
          Get-Content 'smoke-dist/PROVENANCE.txt'
      - name: Exercise silent install/uninstall on ephemeral GitHub-hosted Windows ONLY
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -File -Filter '*-setup.exe')
          if ($files.Count -ne 1) { throw "Expected one test setup; found $($files.Count)" }
          & './scripts/windows/test-nsis-lifecycle.ps1' -InstallerPath $files[0].FullName -ReportPath 'smoke-dist/LIFECYCLE.txt'
      - name: Retain short-lived test artifact only
        uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-DO-NOT-INSTALL-Optic-NSIS-${{ github.run_id }}
          path: smoke-dist/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
