name: Bootstrap lockfiles (temporary)
on:
  push:
    branches: [feat/desktop-bootstrap]
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'ELITEAYOTO/Alpha-Optic-APP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve npm lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate Rust dependency lock without compilation
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit only dependency lockfiles back to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "build: record resolved npm and Rust lockfiles"
            git push origin HEAD:feat/desktop-bootstrap
          fi
