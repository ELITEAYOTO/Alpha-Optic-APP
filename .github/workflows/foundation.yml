name: Foundation checks
on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify repository baseline
        run: node scripts/check-repo.mjs
      - name: Check dependency boundaries
        run: node scripts/check-boundaries.mjs
